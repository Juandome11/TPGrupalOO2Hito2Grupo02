<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alta de plato')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4" style="max-width: 560px;">
	<h1 class="h3 mb-3">Alta de plato</h1>

	<form th:object="${plato}" th:action="@{/responsable/platos}" method="post">
		<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
			<div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
		</div>
		<div class="form-group">
			<label for="nombre">Nombre</label>
			<input type="text" class="form-control" id="nombre" th:field="*{nombre}">
			<small class="text-danger" th:errors="*{nombre}"></small>
		</div>
		<div class="form-row">
			<div class="form-group col-md-6">
				<label for="precioVenta">Precio de venta ($)</label>
				<input type="number" step="0.01" class="form-control" id="precioVenta" th:field="*{precioVenta}">
				<small class="text-danger" th:errors="*{precioVenta}"></small>
			</div>
			<div class="form-group col-md-6">
				<label for="costoProduccion">Costo de producción ($)</label>
				<input type="number" step="0.01" class="form-control" id="costoProduccion" th:field="*{costoProduccion}">
				<small class="text-danger" th:errors="*{costoProduccion}"></small>
			</div>
		</div>
		<button type="submit" class="btn btn-primary">Guardar</button>
		<a class="btn btn-link" th:href="@{/responsable/platos}">Cancelar</a>
	</form>
</div>
</body>
</html>
