<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carga de Pedidos - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Registrar Nuevo Pedido</h2>

        <!-- Alerta de Error (Muestra tus validaciones de negocio si fallan) -->
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <!-- Alerta de Éxito -->
        <div th:if="${exito}" class="alert alert-success" role="alert" th:text="${exito}"></div>

        <!-- Formulario Thymeleaf -->
        <form th:action="@{/responsable/pedidos/nuevo}" th:object="${pedidoDTO}" method="post">

            <div class="mb-3">
                <label for="unidadId" class="form-label">ID de la Unidad de Venta:</label>
                <input type="number" class="form-control" id="unidadId" th:field="*{unidadId}" required>
            </div>

            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha del Pedido:</label>
                <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>
                <div class="form-text text-muted">Validación: Debe ser obligatoriamente la fecha actual.</div>
            </div>

            <hr class="my-4">
            <h4 class="mb-3">Ítems del Pedido</h4>

            <div class="row mb-3">
                <div class="col-md-7">
                    <label class="form-label">ID del Plato:</label>
                    <!-- Quitamos el required de acá -->
                    <input type="number" class="form-control" name="detalles[0].platoId">
                </div>
                <div class="col-md-5">
                    <label class="form-label">Cantidad:</label>
                    <!-- Quitamos el required de acá -->
                    <input type="number" class="form-control" name="detalles[0].cantidad" value="1" min="1">
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-success">Guardar Pedido</button>
                <a th:href="@{/responsable}" class="btn btn-secondary">Volver al Inicio</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
