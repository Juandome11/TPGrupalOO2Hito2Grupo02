<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ranking de unidades')}"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
  <a th:href="@{/admin}">&larr; Volver a festivales</a>
  <h1 class="h3 my-3">Ranking de unidades: <span th:text="${festival.nombre}"></span></h1>
  <div class="alert alert-info" th:if="${ranking.isEmpty()}">Este festival todavía no tiene unidades registradas.</div>
  <table class="table table-striped table-sm bg-white" th:unless="${ranking.isEmpty()}">
    <thead class="thead-dark"><tr><th>#</th><th>Unidad</th><th>Recaudación</th></tr></thead>
    <tbody><tr th:each="r, estado : ${ranking}"><td th:text="${estado.count}"></td><td th:text="${r.unidadNombre}"></td><td th:text="${#numbers.formatDecimal(r.recaudacionTotal, 1, 2)}"></td></tr></tbody>
  </table>
</div></body></html>
