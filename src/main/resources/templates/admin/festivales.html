<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Festivales')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
	<h1 class="h3 mb-3">Festivales</h1>
	<table class="table table-striped table-sm bg-white">
		<thead class="thead-dark">
			<tr><th>Nombre</th><th>Temporada</th><th>Desde</th><th>Hasta</th><th>Días</th><th></th></tr>
		</thead>
		<tbody>
			<tr th:each="f : ${festivales}">
				<td th:text="${f.nombre}"></td>
				<td th:text="${f.temporada}"></td>
				<td th:text="${#temporals.format(f.fechaInicio, 'dd/MM/yyyy')}"></td>
				<td th:text="${#temporals.format(f.fechaFin, 'dd/MM/yyyy')}"></td>
				<td th:text="${f.duracionDias}"></td>
				<td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/festival/{id}/unidades(id=${f.id})}">Ver unidades de venta</a></td>
			</tr>
		</tbody>
	</table>
</div>
</body>
</html>
