<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Unidades con mayor canon')}"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
  <a th:href="@{/admin}">&larr; Volver a festivales</a>
  <h1 class="h3 my-3">Unidades con mayor canon: <span th:text="${festival.nombre}"></span></h1>
  <form class="form-inline mb-3" method="get" th:action="@{/admin/festival/{id}/mayores-canon(id=${festival.id})}">
    
  </form>
  <div class="alert alert-info" th:if="${reporte.isEmpty()}">No hay unidades para mostrar o el festival no tiene configurado el costo.</div>
  <table class="table table-striped table-sm bg-white" th:unless="${reporte.isEmpty()}">
    <thead class="thead-dark"><tr><th>Nombre comercial</th><th>Código</th><th>Tipo de unidad</th><th>Canon</th></tr></thead>
    <tbody><tr th:each="r : ${reporte}"><td th:text="${r.nombreComercial}"></td><td th:text="${r.codigo}"></td><td th:text="${r.tipoUnidad}"></td><td th:text="${#numbers.formatDecimal(r.canon, 1, 2)}"></td></tr></tbody>
  </table>
</div></body></html>
