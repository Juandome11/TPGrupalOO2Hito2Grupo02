<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar unidad de venta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4" style="max-width: 820px;">
	<h1 class="h3">Registrar una unidad de venta</h1>
	<p class="text-muted">Se crea la unidad junto con su responsable y el usuario con el que va a ingresar.</p>

	<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
		<div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
	</div>

	<form th:action="@{/unidad/registro}" th:object="${registro}" method="post">
		<h2 class="h5 mt-3">Unidad</h2>
		<div class="form-row">
			<div class="form-group col-md-6">
				<label for="festivalId">Festival</label>
				<select class="form-control" id="festivalId" th:field="*{festivalId}">
					<option value="">Elegí un festival</option>
					<option th:each="f : ${festivales}" th:value="${f.id}"
						th:text="${f.nombre + ' (' + #temporals.format(f.fechaInicio, 'dd/MM/yyyy') + ' al ' + #temporals.format(f.fechaFin, 'dd/MM/yyyy') + ')'}"></option>
				</select>
				<small class="text-danger" th:errors="*{festivalId}"></small>
			</div>
			<div class="form-group col-md-6">
				<label for="tipo">Tipo de unidad</label>
				<select class="form-control" id="tipo" th:field="*{tipo}" onchange="cambiarTipo()">
					<option value="FOOD_TRUCK">Food Truck</option>
					<option value="DESARMABLE">Puesto Desarmable</option>
				</select>
			</div>
		</div>
		<div class="form-row">
			<div class="form-group col-md-6">
				<label for="nombreComercial">Nombre comercial</label>
				<input type="text" class="form-control" id="nombreComercial" th:field="*{nombreComercial}">
				<small class="text-danger" th:errors="*{nombreComercial}"></small>
			</div>
			<div class="form-group col-md-3">
				<label for="superficie">Superficie (m²)</label>
				<input type="number" step="0.01" class="form-control" id="superficie" th:field="*{superficie}">
				<small class="text-danger" th:errors="*{superficie}"></small>
			</div>
			<div class="form-group col-md-3">
				<label for="codigo">Código (10 caracteres)</label>
				<input type="text" maxlength="10" class="form-control" id="codigo" th:field="*{codigo}"
					placeholder="FT-1234567">
				<small class="text-danger" th:errors="*{codigo}"></small>
			</div>
		</div>

		<div id="datosFoodTruck" class="form-row">
			<div class="form-group col-md-6">
				<label for="patente">Patente</label>
				<input type="text" class="form-control" id="patente" th:field="*{patente}">
			</div>
			<div class="form-group col-md-6 d-flex align-items-end">
				<div class="form-check">
					<input type="checkbox" class="form-check-input" id="requiereConexionElectrica"
						th:field="*{requiereConexionElectrica}">
					<label class="form-check-label" for="requiereConexionElectrica">Requiere conexión eléctrica</label>
				</div>
			</div>
		</div>
		<div id="datosDesarmable" class="form-row">
			<div class="form-group col-md-6">
				<label for="cantCarpas">Cantidad de carpas</label>
				<input type="number" class="form-control" id="cantCarpas" th:field="*{cantCarpas}">
				<small class="text-danger" th:errors="*{cantCarpas}"></small>
			</div>
			<div class="form-group col-md-6">
				<label for="tiempoMontaje">Tiempo de montaje (minutos)</label>
				<input type="number" class="form-control" id="tiempoMontaje" th:field="*{tiempoMontaje}">
				<small class="text-danger" th:errors="*{tiempoMontaje}"></small>
			</div>
		</div>

		<h2 class="h5 mt-3">Responsable</h2>
		<div class="form-row">
			<div class="form-group col-md-6">
				<label for="nombre">Nombre</label>
				<input type="text" class="form-control" id="nombre" th:field="*{nombre}">
				<small class="text-danger" th:errors="*{nombre}"></small>
			</div>
			<div class="form-group col-md-6">
				<label for="apellido">Apellido</label>
				<input type="text" class="form-control" id="apellido" th:field="*{apellido}">
				<small class="text-danger" th:errors="*{apellido}"></small>
			</div>
		</div>
		<div class="form-row">
			<div class="form-group col-md-4">
				<label for="dni">DNI</label>
				<input type="text" class="form-control" id="dni" th:field="*{dni}">
				<small class="text-danger" th:errors="*{dni}"></small>
			</div>
			<div class="form-group col-md-4">
				<label for="email">Email</label>
				<input type="email" class="form-control" id="email" th:field="*{email}">
				<small class="text-danger" th:errors="*{email}"></small>
			</div>
			<div class="form-group col-md-4">
				<label for="fechaNacimiento">Fecha de nacimiento</label>
				<input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}">
				<small class="text-danger" th:errors="*{fechaNacimiento}"></small>
			</div>
		</div>

		<h2 class="h5 mt-3">Usuario de acceso</h2>
		<div class="form-row">
			<div class="form-group col-md-6">
				<label for="username">Usuario</label>
				<input type="text" class="form-control" id="username" th:field="*{username}" autocomplete="off">
				<small class="text-danger" th:errors="*{username}"></small>
			</div>
			<div class="form-group col-md-6">
				<label for="password">Contraseña</label>
				<input type="password" class="form-control" id="password" th:field="*{password}" autocomplete="new-password">
				<small class="text-danger" th:errors="*{password}"></small>
			</div>
		</div>

		<button type="submit" class="btn btn-primary">Registrar</button>
		<a class="btn btn-link" th:href="@{/}">Cancelar</a>
	</form>
</div>

<script>
	function cambiarTipo() {
		var foodTruck = document.getElementById('tipo').value === 'FOOD_TRUCK';
		document.getElementById('datosFoodTruck').style.display = foodTruck ? '' : 'none';
		document.getElementById('datosDesarmable').style.display = foodTruck ? 'none' : '';
	}
	cambiarTipo();
</script>
</body>
</html>
