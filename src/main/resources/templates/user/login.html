<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-5" style="max-width: 420px;">
	<h1 class="h3 mb-3">Iniciar sesión</h1>

	<div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
	<div class="alert alert-info" th:if="${param.logout}">Cerraste sesión.</div>
	<div class="alert alert-success" th:if="${param.registrado}">
		Unidad registrada. Ya podés iniciar sesión con el usuario que elegiste.
	</div>

	<form th:action="@{/loginprocess}" method="post">
		<div class="form-group">
			<label for="username">Usuario</label>
			<input type="text" class="form-control" id="username" name="username" required autofocus>
		</div>
		<div class="form-group">
			<label for="password">Contraseña</label>
			<input type="password" class="form-control" id="password" name="password" required>
		</div>
		<button type="submit" class="btn btn-primary btn-block">Ingresar</button>
	</form>
	<p class="mt-3 text-center">
		¿Sos responsable de una unidad nueva?
		<a th:href="@{/unidad/registro}">Registrala acá</a>
	</p>
</div>
</body>
</html>
